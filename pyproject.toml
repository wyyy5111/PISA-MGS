[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pisa-mgs"
version = "0.1.0"
description = "Frozen-feature mouse grimace scoring with source-calibrated and per-image shift adaptation"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Wenji Wang"}, {name = "Yiming Yang"}, {name = "Dehua Zhang"}]
dependencies = [
  "torch==2.8.0",
  "torchvision==0.23.0",
  "numpy>=2.2.6,<3",
  "Pillow==11.3.0",
  "scipy==1.16.1",
  "timm==1.0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2"]

[project.scripts]
pisa-mgs = "pisa_mgs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
